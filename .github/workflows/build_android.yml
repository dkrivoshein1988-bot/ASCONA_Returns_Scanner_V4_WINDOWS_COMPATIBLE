name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform
        run: flutter create --platforms=android .

      - name: Configure Android camera permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in text:
              text = text.replace("<manifest ", f"<manifest ")
              insert_at = text.find(">") + 1
              text = text[:insert_at] + f"\n    {permission}" + text[insert_at:]
          crop_activity = '''<activity
              android:name="com.yalantis.ucrop.UCropActivity"
              android:screenOrientation="portrait"
              android:theme="@style/Theme.AppCompat.Light.NoActionBar" />'''
          if "com.yalantis.ucrop.UCropActivity" not in text:
              text = text.replace("</application>", f"        {crop_activity}\n    </application>")
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Configure Android min SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Prepare Tesseract Russian OCR data
        shell: bash
        run: |
          mkdir -p assets/tessdata
          curl -L --retry 3 -o assets/tessdata/rus.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/rus.traineddata
          curl -L --retry 3 -o assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          cat > assets/tessdata_config.json <<'JSON'
          {
            "files": [
              "rus.traineddata",
              "eng.traineddata"
            ]
          }
          JSON

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Tesseract for current Android Gradle
        shell: bash
        run: |
          plugin_gradle=$(find "$HOME/.pub-cache" -path "*/flutter_tesseract_ocr-0.4.31/android/build.gradle" -print -quit)
          if [ -z "$plugin_gradle" ]; then
            echo "flutter_tesseract_ocr Android build.gradle was not found"
            exit 1
          fi
          sed -i 's/jcenter()/mavenCentral()/g' "$plugin_gradle"
          if ! grep -q '^android.newDsl=false$' android/gradle.properties; then
            echo 'android.newDsl=false' >> android/gradle.properties
          fi
          echo "Patched: $plugin_gradle"

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ascona-returns-apk
          path: build/app/outputs/flutter-apk/app-release.apk
