name: ascona_returns_scanner
description: ASCONA Scanner MVP for marketplace returns processing.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tesseract_ocr: ^0.4.31
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  mobile_scanner: ^7.2.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata_config.json
    - assets/tessdata/
